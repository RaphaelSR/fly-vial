<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vial</title>
<meta name="description" content="Keep a fruit fly alive for fifty days and teach her tricks. Her reactions run on the real FlyWire connectome.">
<meta name="theme-color" content="#0B1114">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="boot">
  <div class="boot-inner">
    <div class="jar" aria-hidden="true"><span></span><span></span><span></span></div>
    <h1 data-i18n="app.title"></h1>
    <p class="sub" data-i18n="app.sub"></p>
    <div class="load">
      <div class="track"><div id="loadBar"></div></div>
      <p id="loadLabel" class="mono"></p>
      <p id="loadDetail" data-i18n="boot.detail"></p>
    </div>
  </div>
</div>

<header class="top">
  <div class="brand">
    <span class="mark" aria-hidden="true"></span>
    <div><h1 data-i18n="app.title"></h1><p id="day" class="mono"></p></div>
  </div>
  <select id="lang" class="lang" aria-label="Language"></select>
</header>

<main>
  <section class="stage">
    <canvas id="vial"></canvas>
    <div class="stage-top">
      <span id="firing" class="mono chip-stat"></span>
      <button class="info" data-info="brain" aria-label="info">i</button>
    </div>
    <p id="status" class="status"></p>
    <div id="dead" class="dead">
      <button id="btnNew" class="primary" data-i18n="state.newfly"></button>
    </div>
  </section>

  <aside class="panel">
    <section class="block">
      <h2><span data-i18n="needs.title"></span><button class="info" data-info="life" aria-label="info">i</button></h2>
      <div class="needs">
        <label data-i18n="need.hunger"></label><span class="meter"><i id="bar-hunger"></i></span>
        <label data-i18n="need.thirst"></label><span class="meter"><i id="bar-thirst"></i></span>
        <label data-i18n="need.dirt"></label><span class="meter"><i id="bar-dirt"></i></span>
        <label data-i18n="need.energy"></label><span class="meter"><i id="bar-energy"></i></span>
      </div>
      <h2 class="mt" data-i18n="care.title"></h2>
      <div class="care">
        <button id="care-feed" class="act" data-i18n="care.feed"></button>
        <button id="care-water" class="act" data-i18n="care.water"></button>
        <button id="care-clean" class="act" data-i18n="care.clean"></button>
        <button id="care-light" class="act ghost"></button>
      </div>
    </section>

    <section class="block grow">
      <h2><span data-i18n="train.title"></span><button class="info" data-info="train" aria-label="info">i</button>
        <span id="trials" class="mono dim"></span></h2>
      <p class="tiny" data-i18n="train.hint"></p>

      <p class="lab" data-i18n="train.cue"></p>
      <div id="cues" class="chips"></div>

      <p class="lab" data-i18n="train.want"></p>
      <div id="wants" class="chips"></div>

      <button id="btnPresent" class="primary wide" data-i18n="train.present"></button>
      <p id="trialMsg" class="trial"></p>
      <div id="judge" class="judge">
        <button id="btnReward" class="reward" data-i18n="train.reward"></button>
        <button id="btnSkip" class="ghost" data-i18n="train.skip"></button>
      </div>
      <p id="conf" class="tiny dim"></p>
      <button id="btnForget" class="link" data-i18n="train.forget"></button>
    </section>
  </aside>
</main>

<div id="infoPop" role="dialog"><h4></h4><p></p></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
